# Builds the documentation (make docs) and publishes the site to GitHub
# Pages. Requires Pages Source set to "GitHub Actions" in the repo settings.
name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Install doxybook2
        run: |
          curl -fsSL -o /tmp/doxybook2.zip \
            https://github.com/matusnovak/doxybook2/releases/download/v1.5.0/doxybook2-linux-amd64-v1.5.0.zip
          unzip -q /tmp/doxybook2.zip -d /tmp/doxybook2
          sudo install /tmp/doxybook2/bin/doxybook2 /usr/local/bin/doxybook2

      - name: Install zensical
        run: pip install zensical

      - name: Build docs
        run: make docs

      # Pages runs Jekyll over the uploaded site unless a .nojekyll marker is
      # present, and upload-pages-artifact silently drops dotfiles unless asked.
      - name: Add .nojekyll
        run: touch build/docs/site/.nojekyll

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs/site
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
